[package]
name = "rich-triplet"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rich-triplet"
path = "src/main.rs"

[dependencies]
safetensors = { version = "0.4", optional = true }
memmap2 = { version = "0.9", optional = true }
cblas = { version = "0.4", optional = true }
blas-src = { version = "0.10", optional = true, features = ["accelerate"] }
objc2-metal = { version = "0.3.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2 = { version = "0.6.1", optional = true }

[features]
default = ["blas"]
weight-loading = ["safetensors"]
mmap-loading = ["memmap2"]
blas = ["cblas", "blas-src"]
parallel = []
metal = ["dep:objc2-metal", "dep:objc2-foundation", "dep:objc2"]

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.build-override]
opt-level = 3

[dev-dependencies]
